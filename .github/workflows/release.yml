name: Native installers

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified installers (run on the matching v-prefixed release tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build and launch on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            suffix: linux-x64.deb
          - os: windows-2025
            suffix: windows-x64-setup.exe
          - os: macos-15
            suffix: macos-arm64.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and check the version
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -eu
          version=$(node -p "require('./desktop/tauri.conf.json').version")
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "polar-desktop") | .version')
          test "$version" = "$cargo_version"
          if [[ "$PUBLISH" == true ]]; then
            test "$GITHUB_REF" = "refs/tags/v$version"
          fi
          echo "POLAR_VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == macOS ]]; then echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"; fi
          if [[ "$RUNNER_OS" == Windows ]]; then echo "CARGO_BUILD_TARGET=x86_64-pc-windows-msvc" >> "$GITHUB_ENV"; fi
      - name: Install Linux build and window-test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev dpkg-dev xvfb xauth xdotool dbus-daemon desktop-file-utils
      - name: Install Windows packaging tools and WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE) { throw 'NSIS installation failed' }
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $runtime = Get-ItemPropertyValue "HKLM:\SOFTWARE\WOW6432Node\$client", "HKCU:\Software\$client" -Name pv -ErrorAction SilentlyContinue
          if (!$runtime) {
            $setup = Join-Path $env:RUNNER_TEMP 'WebView2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
            $signature = Get-AuthenticodeSignature $setup
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation,') { throw 'Unexpected WebView2 signature' }
            $result = Start-Process $setup -ArgumentList '/silent','/install' -PassThru -Wait
            if ($result.ExitCode) { throw "WebView2 setup exited with $($result.ExitCode)" }
          }
      - name: Check Windows text rendering in Edge
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          npm install --prefix "$RUNNER_TEMP/polar-ui" --no-save --no-package-lock --ignore-scripts playwright@1.59.1
          export NODE_PATH="$RUNNER_TEMP/polar-ui/node_modules"
          export POLAR_CHROME="C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"
          export POLAR_TEST_URL="http://127.0.0.1:38123/"
          python -m http.server 38123 --bind 127.0.0.1 --directory desktop/ui > "$RUNNER_TEMP/polar-ui-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 "$POLAR_TEST_URL" -o /dev/null
          node tests/desktop-readability.cjs
      - name: Test the native code
        run: cargo test --workspace --release --locked
      - name: Test the library model
        run: node --test tests/desktop-model.mjs
      - name: Package and launch the Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/build.ps1
          ./tests/smoke-install.ps1 "target/dist/Polar-$env:POLAR_VERSION-windows-x64-setup.exe"
      - name: Package and launch the Unix app
        if: runner.os != 'Windows'
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          packaging/build-unix.sh
          tests/smoke-install.sh "target/dist/Polar-$POLAR_VERSION-$SUFFIX"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.os }}
          path: target/dist/Polar-${{ env.POLAR_VERSION }}-${{ matrix.suffix }}
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    if: inputs.publish && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Publish a complete release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          files=()
          for suffix in windows-x64-setup.exe linux-x64.deb macos-arm64.dmg; do
            file="Polar-$version-$suffix"
            test -s "$file"
            files+=("$file")
          done
          sha256sum "${files[@]}" > SHA256SUMS
          args=()
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Polar $version" "${args[@]}" \
            --notes "Windows x64 (NSIS), Ubuntu 24.04 x64 (.deb), macOS Apple Silicon (.dmg). Compare your download against SHA256SUMS. Windows is unsigned. The macOS app is ad-hoc signed and has not been notarized." \
            "${files[@]}" SHA256SUMS
