[package]
name = "polar"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
keyvalues-parser = "0.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
tempfile = "3"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }



[workspace]
members = ["desktop"]
default-members = ["."]
resolver = "3"
