[package]
name = "polar-desktop"
version = "1.0.0-rc.1"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = "2"

[target.'cfg(windows)'.dependencies]
polar = { path = ".." }
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
base64 = "0.22"
tempfile = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_System_Threading","Win32_UI_Shell","Win32_UI_Shell_Common","Win32_System_Com","Win32_System_Registry","Win32_UI_Controls_Dialogs","Win32_Storage_FileSystem"] }
