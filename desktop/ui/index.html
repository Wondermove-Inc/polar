<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polar</title><link rel="stylesheet" href="style.css"></head><body>
<main id="polar">
<div class="bg" id="base"></div><div class="bg" id="fade" style="opacity:0"></div><div class="wash"></div>
<header><div class="brand"><span class="star" aria-hidden="true">✦</span> POLAR</div><nav class="tabs" id="nav"><button id="home" class="tab" data-word="games"></button><button id="library" class="tab" data-word="library"></button></nav><div class="utility"><button class="gear" id="settings"><span aria-hidden="true">⚙</span><span data-word="settings"></span></button><time class="clock"></time></div></header>
<div class="rail" role="group"></div>
<div id="stage"><section class="details" hidden><div class="meta"><span class="store"></span><span class="genre"></span></div><h1></h1><div class="buttons"><button class="play" id="play" data-word="play"></button></div></section>
<section id="homeEmpty"><h2 data-word="empty"></h2><p data-word="emptyHelp"></p><div class="buttons"><button class="play" id="addEmpty" data-word="add"></button><button class="quietBtn" id="scanEmpty" data-word="scan"></button></div></section></div>
<section class="lib" hidden><div class="libHeading"><h2 data-word="library"></h2><div class="buttons"><button id="edit" class="quietBtn"></button><button id="addLib" class="quietBtn" data-word="add"></button></div></div><div class="filters"></div><div class="grid"></div><p class="empty" data-word="noMatches"></p></section>
<footer><div class="footkeys"></div><span class="counter"></span></footer><div id="notice" role="status"></div>
<dialog id="panel"><div class="popBody"><h2 id="panelTitle"></h2><div id="content"></div><p role="status" id="alert"></p><button class="return" id="close" data-word="close"></button></div></dialog>
</main><script type="module" src="app.mjs"></script></body></html>
